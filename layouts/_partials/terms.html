{{ $page := .page }}
{{ $taxonomy := .taxonomy }}

{{ with $page.GetTerms $taxonomy }}
  <div class="post-tags">
    <div>{{ (index . 0).Parent.LinkTitle }}:</div>
    <ul>
      {{ range . }}
        <li><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>
      {{ end }}
    </ul>
  </div>
{{ end }}
